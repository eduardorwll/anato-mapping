[package]
name = "anato-mapping"
version = "0.1.0"
description = "Ferramenta desktop para marcação anatômica e exportação JSON — Atlas Anatômico Digital (UFPel)"
authors = ["UFPel Atlas Anatômico Digital"]
edition = "2021"

[lib]
name = "anato_mapping_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
